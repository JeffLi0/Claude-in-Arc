<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude in Arc updates</title>
  <style>
    :root { --bg: #faf9f5; --fg: #141413; --muted: #5e5d59; --accent: #d97757; --card: #ffffff; --border: #e8e6dc; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1f1e1d; --fg: #f0eee6; --muted: #a3a29c; --card: #262624; --border: #3a3936; }
    }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { max-width: 560px; margin: 12vh auto; padding: 0 16px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 28px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { margin: 0 0 14px; color: var(--muted); }
    code { font: 13px ui-monospace, Menlo, monospace; }
    button { background: var(--accent); color: #fff; border: 0; border-radius: 9px; padding: 10px 18px; font: inherit; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    #status { margin-top: 16px; min-height: 1.5em; color: var(--fg); }
    .error { color: #c0392b !important; }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1 id="title">Keep Claude in Arc up to date</h1>
      <p id="intro">Arc can't update extensions loaded with <b>Load unpacked</b>, so Claude in Arc updates itself. It needs permission to write to the folder you loaded, once.</p>
      <p>Click the button and choose the <code>Claude-in-Arc</code> folder you selected in <code>arc://extensions</code>.</p>
      <button id="go">Choose folder</button>
      <div id="status" role="status"></div>
    </div>
  </main>
  <script src="assets/arc-updater-store.js"></script>
  <script src="assets/arc-setup.js"></script>
</body>
</html>
