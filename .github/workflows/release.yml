# Rebuilds Claude in Arc whenever Anthropic ships a new Claude in Chrome, and
# whenever the Arc patches change. A failed run means an upstream release
# moved code a patch depends on; GitHub emails the repo owner about it.
name: Release

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["arc/**", "scripts/**"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check upstream version
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(python3 scripts/build.py --check)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Scheduled runs only act on a new upstream version; pushes and manual
      # runs rebuild the current one with the latest patches.
      - name: Build
        if: steps.upstream.outputs.exists == 'false' || github.event_name != 'schedule'
        run: python3 scripts/build.py --zip

      - name: Publish release
        if: steps.upstream.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          gh release create "v$VERSION" "dist/Claude-in-Arc-$VERSION.zip" \
            --title "Claude in Arc $VERSION" \
            --notes "Built from Claude in Chrome $VERSION with the Arc patches applied. Unzip, then load the folder in arc://extensions (or replace the folder you loaded before and click reload)."

      - name: Refresh release assets
        if: steps.upstream.outputs.exists == 'true' && github.event_name != 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.upstream.outputs.version }}
        run: gh release upload "v$VERSION" "dist/Claude-in-Arc-$VERSION.zip" --clobber
